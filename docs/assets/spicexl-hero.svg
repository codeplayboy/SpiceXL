<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">SpiceXL cinematic product banner</title>
  <desc id="desc">A dark navy streaming backdrop with animated cyan and orange light trails and the SpiceXL wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b16"/><stop offset=".55" stop-color="#081a2b"/><stop offset="1" stop-color="#130e1d"/></linearGradient>
    <radialGradient id="cyanGlow" cx="75%" cy="45%" r="58%"><stop offset="0" stop-color="#41ddff" stop-opacity=".48"/><stop offset=".45" stop-color="#19a6cf" stop-opacity=".14"/><stop offset="1" stop-color="#06101e" stop-opacity="0"/></radialGradient>
    <radialGradient id="orangeGlow" cx="78%" cy="78%" r="38%"><stop offset="0" stop-color="#ff8a5c" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#4be6ff" stop-opacity="0"/><stop offset=".5" stop-color="#4be6ff" stop-opacity=".8"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1600" height="720" rx="34" fill="url(#bg)"/><rect width="1600" height="720" rx="34" fill="url(#cyanGlow)"/><rect width="1600" height="720" rx="34" fill="url(#orangeGlow)"/>
  <g opacity=".18" fill="none" stroke="#78edff" stroke-width="1"><path d="M760 710C920 560 1120 560 1510 80"/><path d="M850 720C1050 555 1220 545 1590 150"/><path d="M1020 720C1200 580 1330 530 1590 300"/></g>
  <path d="M610 675C870 560 1000 575 1490 135" fill="none" stroke="url(#line)" stroke-width="3" filter="url(#soft)"><animate attributeName="opacity" values=".25;.9;.25" dur="5s" repeatCount="indefinite"/></path>
  <circle cx="1220" cy="260" r="120" fill="#44ddff" opacity=".1" filter="url(#blur)"><animateTransform attributeName="transform" type="translate" values="0 0;24 -12;0 0" dur="8s" repeatCount="indefinite"/></circle>
  <g transform="translate(105 170)">
    <circle cx="36" cy="42" r="33" fill="#43dcf7" opacity=".14"/><path d="M36 8c-15 12-22 25-18 37-9 5-14 14-10 27 5-7 10-10 17-11-2 10 3 18 13 25 2-10 8-16 17-20 8-4 12-13 5-24-3 8-9 12-16 13 6-12 4-29-8-47z" fill="#41def8"/><path d="M23 57c10 2 21 0 30-7-3 10-10 18-18 22-7-4-11-9-12-15z" fill="#a6f5ff" opacity=".7"/>
    <text x="94" y="58" fill="#f1f7fb" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" letter-spacing="-3">Spice<tspan fill="#ff895c">XL</tspan></text><text x="98" y="105" fill="#8da4b8" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="5">WATCH WHAT MOVES YOU</text>
  </g>
  <g transform="translate(108 400)" opacity=".6"><rect width="390" height="1" fill="#75edff"/><rect y="38" width="230" height="1" fill="#ff895c" opacity=".7"/></g>
  <text x="108" y="475" fill="#e4f1f7" font-family="Arial,Helvetica,sans-serif" font-size="26" letter-spacing="4">DISCOVER · REMEMBER · PLAY</text><text x="108" y="525" fill="#8da4b8" font-family="Arial,Helvetica,sans-serif" font-size="18">A responsive streaming catalogue experience for Android and Windows.</text>
</svg>
